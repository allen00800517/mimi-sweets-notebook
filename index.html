<h1>蜜蜜的四季甜點筆記</h1><p class="sub">裝進手機主畫面，像 App 一樣玩</p>
<a class="app" href="play/"><img src="play/icon-180.png" alt=""><span><b>開始玩</b><small>點這裡進入遊戲</small></span></a>
<p class="how"><b>iPhone</b></p><ol><li>用 <b>Safari</b> 點上面的「開始玩」。</li><li>點下方的「分享」按鈕，選「加入主畫面」，再按「加入」。</li>
<li>從主畫面的新圖示打開，等下方顯示「已經存進手機」就完成了。</li></ol>
<p class="how"><b>Android</b></p><ol><li>用 <b>Chrome</b> 點上面的「開始玩」。</li><li>點右上角「⋮」，選「加到主畫面」或「安裝應用程式」。</li></ol>
<p class="note">第一次會下載約 50MB，建議連 Wi-Fi，之後沒有網路也能玩。不想安裝的話，直接在瀏覽器裡玩也可以。</p>
